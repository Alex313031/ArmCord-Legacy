allowBuilds:
  "@parcel/watcher": true
  "@vencord/venmic": true
  electron-winstaller: true
  # electron-legacy downloads its binary in postinstall. pnpm only accepts a
  # git-hosted package here by its full id, so this line names the commit the
  # v44.11.5 tag points at and has to change whenever the Electron tag does.
  electron@https://codeload.github.com/Alex313031/electron-legacy/tar.gz/35c08998b99590393cc3a14488ad6c0e38dcc8ea: true
  esbuild: true
  koffi: true

minimumReleaseAgeExclude:
  - electron@42.3.3 || 43.2.0 || 44.2.0 || 44.7.2 || 44.9.0

overrides:
  yauzl: "^3.3.1" # Electron still can't get their shit together https://github.com/electron/electron/issues/51619
